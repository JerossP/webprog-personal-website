<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Profile Webpage</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/flexbox-grid.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

</head>
<body>
  <div class="profile-container">
    <header>
      <h1>PERSONAL PROFILE WEBPAGE</h1>
    </header>
    <div class="profile-content">
      <img src="images/gradpic.png" alt="Your Profile" class="profile-picture"> 
      <p>Hello! I am Jeross Reilan R. Perez from Mandaluyong City. I love going out and I am very active when it comes to physical activities, although I am not sporty.</p>
      <div class="button-container">
        <button onclick="showContent('education')">Education</button>
        <button onclick="showContent('course')">Course</button>
        <button onclick="showContent('experience')">IT Experience</button>
        <button onclick="showContent('hobbies')">Hobbies</button>
        <button onclick="showContent('goals')">Goals</button>
        <button onclick="showContent('gallery')">Gallery</button>
      </div>
      <div id="dynamic-content" class="dynamic-content">
        <p>Click the buttons to know more about me!</p>
      </div>
    </div>
  </div>
  
  <script src="js/script.js"></script>
 
</body>
</html>
